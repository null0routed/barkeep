name: Deploy

# Deploys the static export to barkeep.cloudkern.com through Cloudflare Access SSH.
#
# Guardrails (see PLAN5.MD §2–§13):
#   * Trigger is v* tags (or a manual dispatch) ONLY — never a branch push.
#   * A human must approve the "CD Environment" before anything executes, so no
#     runner-minute budget and no secret is ever touched ahead of review.
#   * Transport is Design A: headless WARP (`cloudflared access ssh` service
#     token) + the two forced-command keys. The runner cannot shell, read, or
#     sudo beyond the two fixed server-side actions. Worst case on runner
#     compromise = overwrite both content dirs + flip the web symlink.
#   * Only two third-party actions, both SHA-pinned (no floating tag).
#
# Secrets (all scoped to the "CD Environment" so the PR-context CI job cannot read them):
#   BARKEEP_COLD_SSH_KEY, BARKEEP_PROMOTE_SSH_KEY          — the two private keys
#   CLOUDFLARE_ACCESS_TOKEN_ID, CLOUDFLARE_ACCESS_TOKEN_SECRET — headless Access service-token
#   BARKEEP_SSH_KNOWN_HOSTS                                 — pinned host key(s) for BARKEEP_VPS_HOST
# Variable:
#   BARKEEP_VPS_HOST                                         — the name you SSH to (ssh.cloudkern.com)
#   BARKEEP_WEB_URL                                          — the public site URL (https://barkeep.cloudkern.com)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# Never two deploys in flight: a mid-swap cancel would leave the live link ambiguous.
concurrency:
  group: barkeep-cd
  cancel-in-progress: false

# The workflow needs no token privilege beyond reading the code it builds.
permissions:
  contents: read

jobs:
  deploy:
    name: gates → build → rsync cold → promote → smoke
    runs-on: ubuntu-latest
    environment: CD Environment           # required-reviewer gate on the whole job
    timeout-minutes: 15
    env:
      # A `run:` bash shell does not see GH vars/secrets by name unless they are bound
      # here, so EVERY value a shell command reads is sourced from its true GH context
      # and set as a real, checkable env var. (Missing → empty → the fail-fast guard in
      # the materialize step stops the run before anything touches production.)
      BARKEEP_VPS_HOST: ${{ vars.BARKEEP_VPS_HOST }}
      BARKEEP_WEB_URL: ${{ vars.BARKEEP_WEB_URL }}
      BARKEEP_COLD_SSH_KEY: ${{ secrets.BARKEEP_COLD_SSH_KEY }}
      BARKEEP_PROMOTE_SSH_KEY: ${{ secrets.BARKEEP_PROMOTE_SSH_KEY }}
      BARKEEP_SSH_KNOWN_HOSTS: ${{ secrets.BARKEEP_SSH_KNOWN_HOSTS }}
      # Headless Access auth. `cloudflared access ssh` (v2026.10.7, read from its own
      # `--help`) consumes the Access service token via TUNNEL_SERVICE_TOKEN_ID/_SECRET
      # (equivalently the --service-token-id/--service-token-secret flags). The
      # CF_ACCESS_TOKEN_* names the secrets were previously named after are NOT
      # referenced anywhere in the binary, so they would silently fail to auth.
      CF_ACCESS_NO_BROWSER: "1"
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_TOKEN_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_TOKEN_SECRET }}

    steps:
      # ── gates: identical to ci.yml; must pass before we touch production ──
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24 # matches .nvmrc
          cache: npm

      # ── install cloudflared: NOT preinstalled on ubuntu-latest ──
      # Fixed release + SHA256 verified BEFORE the binary is placed on PATH: no
      # floating "latest", and an unverified binary can never reach the ssh
      # ProxyCommand. Installed into a job-local dir (no sudo, nothing under system
      # paths) and exposed to later steps via GITHUB_PATH. Placed before the gate
      # build so a download/hash/network failure fails fast and cheap — the whole
      # point for a free-tier minute budget.
      - name: Install cloudflared (pinned 2026.10.7, SHA256-verified)
        run: |
          set -euo pipefail
          CF_VERSION="2026.10.7"
          CF_SHA256="1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872"
          CF_HOME="${RUNNER_TEMP}/cloudflared"
          CF_BIN="${CF_HOME}/bin"
          STAGE="${CF_HOME}/cloudflared"
          mkdir -p "${CF_BIN}"
          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 30 \
            -o "${STAGE}" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CF_VERSION}/cloudflared-linux-amd64"
          echo "sha256 (expect): ${CF_SHA256}"
          echo "sha256 (actual): $(sha256sum "${STAGE}" | cut -d' ' -f1)"
          ( cd "${CF_HOME}" && echo "${CF_SHA256}  cloudflared" | sha256sum --strict -c - )
          install -m 755 "${STAGE}" "${CF_BIN}/cloudflared"
          rm -f "${STAGE}"
          echo "${CF_BIN}" >> "${GITHUB_PATH}"
          echo "cloudflared: $("${CF_BIN}/cloudflared" --version 2>&1 | head -n1)"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Verify artifact
        run: |
          set -euo pipefail
          test -f out/index.html
          test -d out/_next
          echo "── build root:"
          find out -maxdepth 1 -mindepth 1 | sort

      # ── deploy ──
      # The private key material is written to 0600 files under RUNNER_TEMP (never git),
      # used for exactly these three steps, then purged. Host checking is STRICT against
      # the pinned BARKEEP_SSH_KNOWN_HOSTS — no accept-new, no UserKnownHostsFile bypass.
      - name: Materialize keys + pinned host key
        run: |
          set -euo pipefail
          [ -n "${BARKEEP_VPS_HOST}" ] || { echo "ERROR: BARKEEP_VPS_HOST variable is not set"; exit 1; }
          [ -n "${BARKEEP_WEB_URL}" ] || { echo "ERROR: BARKEEP_WEB_URL variable is not set"; exit 1; }
          command -v cloudflared >/dev/null 2>&1 || { echo "ERROR: cloudflared not on runner"; exit 1; }
          command -v rsync      >/dev/null 2>&1 || { echo "ERROR: rsync not on runner"; exit 1; }
          KDIR="${RUNNER_TEMP}/barkeep-keys"; mkdir -p "$KDIR"
          printf '%s\n' "${BARKEEP_COLD_SSH_KEY}"    > "$KDIR/cold"
          printf '%s\n' "${BARKEEP_PROMOTE_SSH_KEY}" > "$KDIR/promote"
          printf '%s\n' "${BARKEEP_SSH_KNOWN_HOSTS}" > "$KDIR/known_hosts"
          chmod 600 "$KDIR/cold" "$KDIR/promote"
          test -s "$KDIR/known_hosts"
          echo "cloudflared: $(cloudflared --version 2>&1 | head -n1)"
          echo "target host: ${BARKEEP_VPS_HOST}"

      - name: rsync build → COLD slot (forced command; write-only)
        run: |
          set -euo pipefail
          K="$(realpath "${RUNNER_TEMP}/barkeep-keys")"
          # The remote path is ignored server-side: barkeep-rsyncd pins destination to the
          # currently-cold slot. `--delete` makes the incoming build the exact slot contents.
          # ProxyCommand value is single-quoted so ssh keeps the spaces (matches the proven
          # manual form). The Access service token (TUNNEL_SERVICE_TOKEN_ID/_SECRET) comes
          # from the job env, which cloudflared access ssh reads for headless auth.
          rsync -az --delete --numeric-ids \
            -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityFile=${K}/cold -o UserKnownHostsFile=${K}/known_hosts -o StrictHostKeyChecking=yes -o ProxyCommand='cloudflared access ssh --hostname ${BARKEEP_VPS_HOST}'" \
            out/ "barkeep@${BARKEEP_VPS_HOST}/"
          echo "rsync: ok (build is now the entire COLD slot)"

      - name: Promote (server flips live symlink to the cold slot)
        run: |
          set -euo pipefail
          K="$(realpath "${RUNNER_TEMP}/barkeep-keys")"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityFile="${K}/promote" \
              -o UserKnownHostsFile="${K}/known_hosts" -o StrictHostKeyChecking=yes \
              -o "ProxyCommand=cloudflared access ssh --hostname ${BARKEEP_VPS_HOST}" \
              "barkeep@${BARKEEP_VPS_HOST}" /bin/true
          echo "promote: ok (live symlink now points at the slot that held the new build)"

      - name: Smoke test
        run: |
          set -euo pipefail
          code="$(curl -fsSI "${BARKEEP_WEB_URL}/" | awk 'toupper($1) ~ /^HTTP/{print $2}')"
          echo "HTTP ${code:?expected 200}"
          curl -fsS "${BARKEEP_WEB_URL}/" | grep -oE '<title>[^<]*</title>' | head -n1

      # ── always purge ──
      - name: Purge key + token material
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/barkeep-keys" 2>/dev/null || true
          shopt -s nullglob 2>/dev/null; rm -f "${HOME}/.cloudflared"/*.json 2>/dev/null || true
          echo "purged local key/token material"
