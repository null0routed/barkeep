name: Rollback

# One-generation rollback: flip the live symlink back to the previous slot.
#
# The "promote" forced command is symmetric — it always points the link at the
# currently-COLD slot. After a deploy, the COLD slot is the previous generation,
# so "promote" IS the rollback. No new credential, no new server-side path:
# same key, same action as deploy's promote step.
#
# Manual only (workflow_dispatch) and gated on the same CD Environment reviewer.
# No third-party actions at all (no checkout needed → `permissions: {}` revokes
# the default GITHUB_TOKEN entirely).

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are we rolling back? (recorded in the run output)'
        required: true

concurrency:
  group: barkeep-cd
  cancel-in-progress: false

permissions: {}

jobs:
  rollback:
    name: flip the live symlink back one generation
    runs-on: ubuntu-latest
    environment: CD Environment
    timeout-minutes: 10
    env:
      # Same explicit binding as deploy.yml: a `run:` bash only sees GH vars/secrets by
      # name when bound here, so every shell-referenced value is sourced from its true
      # GH context below.
      BARKEEP_VPS_HOST: ${{ vars.BARKEEP_VPS_HOST }}
      BARKEEP_WEB_URL: ${{ vars.BARKEEP_WEB_URL }}
      BARKEEP_PROMOTE_SSH_KEY: ${{ secrets.BARKEEP_PROMOTE_SSH_KEY }}
      BARKEEP_SSH_KNOWN_HOSTS: ${{ secrets.BARKEEP_SSH_KNOWN_HOSTS }}
      # Same headless auth fix as Deploy: v2026.10.7 reads the service token from
      # TUNNEL_SERVICE_TOKEN_ID/_SECRET (see its --help); CF_ACCESS_TOKEN_* is not used.
      CF_ACCESS_NO_BROWSER: "1"
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_TOKEN_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_TOKEN_SECRET }}

    steps:
      # ── install cloudflared: NOT preinstalled on ubuntu-latest ──
      # Same pinned + SHA256-verified binary as Deploy: fixed release, verified
      # before it is put on PATH, installed into a job-local dir (no sudo), exposed
      # to the later step via GITHUB_PATH so the ProxyCommand can resolve it.
      - name: Install cloudflared (pinned 2026.10.7, SHA256-verified)
        run: |
          set -euo pipefail
          CF_VERSION="2026.10.7"
          CF_SHA256="1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872"
          CF_HOME="${RUNNER_TEMP}/cloudflared"
          CF_BIN="${CF_HOME}/bin"
          STAGE="${CF_HOME}/cloudflared"
          mkdir -p "${CF_BIN}"
          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 30 \
            -o "${STAGE}" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CF_VERSION}/cloudflared-linux-amd64"
          echo "sha256 (expect): ${CF_SHA256}"
          echo "sha256 (actual): $(sha256sum "${STAGE}" | cut -d' ' -f1)"
          ( cd "${CF_HOME}" && echo "${CF_SHA256}  cloudflared" | sha256sum --strict -c - )
          install -m 755 "${STAGE}" "${CF_BIN}/cloudflared"
          rm -f "${STAGE}"
          echo "${CF_BIN}" >> "${GITHUB_PATH}"
          echo "cloudflared: $("${CF_BIN}/cloudflared" --version 2>&1 | head -n1)"

      - name: Materialize promote key + pinned host key
        run: |
          set -euo pipefail
          [ -n "${BARKEEP_VPS_HOST}" ] || { echo "ERROR: BARKEEP_VPS_HOST variable is not set"; exit 1; }
          [ -n "${BARKEEP_WEB_URL}" ] || { echo "ERROR: BARKEEP_WEB_URL variable is not set"; exit 1; }
          command -v cloudflared >/dev/null 2>&1 || { echo "ERROR: cloudflared not on runner"; exit 1; }
          KDIR="${RUNNER_TEMP}/barkeep-rollback"; mkdir -p "$KDIR"
          printf '%s\n' "${BARKEEP_PROMOTE_SSH_KEY}" > "$KDIR/promote"
          printf '%s\n' "${BARKEEP_SSH_KNOWN_HOSTS}" > "$KDIR/known_hosts"
          chmod 600 "$KDIR/promote"
          test -s "$KDIR/known_hosts"
          echo "rollback reason: ${{ inputs.reason }}"

      - name: Flip the live symlink back (promote = point at cold slot = previous gen)
        run: |
          set -euo pipefail
          K="$(realpath "${RUNNER_TEMP}/barkeep-rollback")"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityFile="${K}/promote" \
              -o UserKnownHostsFile="${K}/known_hosts" -o StrictHostKeyChecking=yes \
              -o "ProxyCommand=cloudflared access ssh --hostname ${BARKEEP_VPS_HOST}" \
              "barkeep@${BARKEEP_VPS_HOST}" /bin/true
          echo "rollback: live symlink now points at the previous generation"

      - name: Smoke test
        run: |
          set -euo pipefail
          # Same as Deploy: present a realistic browser User-Agent so the check is not
          # stopped by Cloudflare's bot challenge (cf-mitigated: challenge).
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/133.0.0.0 Safari/537.36"
          ACC="text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
          hdr=(-H "User-Agent: ${UA}" -H "Accept: ${ACC}" -H "Accept-Language: en-US,en;q=0.9")
          code="$(curl -fsSI --max-time 30 "${hdr[@]}" "${BARKEEP_WEB_URL}/" | awk 'toupper($1) ~ /^HTTP/{print $2}')"
          echo "HTTP ${code:?expected 200}"
          curl -fsS --max-time 30 "${hdr[@]}" "${BARKEEP_WEB_URL}/" | grep -oE '<title>[^<]*</title>' | head -n1

      - name: Purge key material
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/barkeep-rollback" 2>/dev/null || true
          shopt -s nullglob 2>/dev/null; rm -f "${HOME}/.cloudflared"/*.json 2>/dev/null || true
          echo "purged local key material"
